# Automated dependency and security updates.
# Maven: catches CVEs in Spring Boot / Spring Cloud / transitive deps between manual reviews.
# github-actions: keeps the CI workflow's own action versions current (actions/checkout etc.).
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    # Spring Boot / Spring Cloud majors change autoconfiguration in ways that need a deliberate
    # migration, not an automated PR - this project is pinned to Boot 4.0.x / Cloud 2025.1.x.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.cloud:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
