# docker/docker-compose.dev.yml
services:
  auth-service:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_SERVER_HOST: clickkart-config-server
      CONFIG_SERVER_USERNAME: admin
      CONFIG_SERVER_PASSWORD: dev-only-secret-change-me
      # container's DNS-resolvable name, not localhost - same reasoning as
      # clickkart-api-gateway's GATEWAY_HOSTNAME override.
      AUTH_SERVICE_HOSTNAME: clickkart-auth-service
      AUTH_SERVICE_ADMIN_USERNAME: admin
      AUTH_SERVICE_ADMIN_PASSWORD: dev-only-secret-change-me
      EUREKA_SERVER_HOST: clickkart-eureka-server
      EUREKA_DASHBOARD_USERNAME: admin
      EUREKA_DASHBOARD_PASSWORD: dev-only-secret-change-me
      JWT_SECRET: dev-only-secret-change-me-please-32bytes-minimum
      DB_HOST: auth-postgres
      REVOCATION_REDIS_HOST: clickkart-gateway-redis
