# src/main/resources/application.properties
# Local bootstrap only - just enough to locate the Config Server. Everything else (datasource,
# JWT/lockout/refresh settings, Eureka registration, Redis revocation store, Feign/Resilience4j,
# logging) is pulled per-profile from clickkart-config-repository (Section 2a Rule 3).
#
# These properties MUST stay in this single profile-agnostic file, not a per-profile
# application-<profile>.properties: spring.config.import=configserver: (below) is resolved
# while this file is processed, before profile-specific documents are loaded, so a
# profile-specific override of spring.cloud.config.username/password would not exist yet at
# the moment the import runs - matching the same reasoning already documented in the
# Gateway's application.properties.
spring.application.name=clickkart-auth-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.cloud.config.uri=http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:admin}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:dev-only-secret-change-me}
spring.cloud.config.fail-fast=true
# clickkart-config-repository is now split into one branch per environment (dev/test/qa/prod),
# each holding only that environment's unsuffixed properties files - the git branch (label) IS
# the environment now, not a filename suffix. Must track SPRING_PROFILES_ACTIVE exactly, or
# this service would activate one profile locally while pulling a DIFFERENT environment's config.
spring.cloud.config.label=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=configserver:

# Profile-invariant management settings live here (not per-profile in config-repo) - same
# split eureka-server/config-server already use. management.endpoints.web.exposure.include and
# management.endpoint.health.show-details DO vary per profile and are already set there.
#
# management.health.probes.enabled=true is what actually exposes the /actuator/health/readiness
# and /actuator/health/liveness sub-paths the k8s manifests (k8s/auth-service/deployment.yaml)
# already point their readiness/liveness probes at - without this, those two paths 404 and every
# pod would fail its k8s health checks despite /actuator/health itself reporting UP.
management.health.probes.enabled=true
management.info.env.enabled=true

# Fixed application behavior, not an environment-varying value - caps a client-supplied
# ?size= on the paginated admin endpoints (listAccounts, audit browse) so a request like
# ?size=2000000000 can't force one query to load the entire table into memory.
spring.data.web.pageable.max-page-size=100

info.service=clickkart-auth-service

